<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blur Detection - DeepGuard</title>
    <link rel="stylesheet" href="/static/css/deepguard-theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --blush: #FFF7F5;
            --peach: #FFD9C9;
            --peach-light: #FFE8DF;
            --voltage: #F26B4F;
            --lilac: #A99AE7;
            --ink: #302A40;
            --ink-light: #6B6B6B;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--blush) 0%, var(--peach-light) 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .page-header h1 {
            color: var(--voltage);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .page-header .subtitle {
            color: var(--ink-light);
            font-size: 1.1rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            margin-bottom: 2rem;
            color: var(--voltage);
            text-decoration: none;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(242, 107, 79, 0.2);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(242, 107, 79, 0.3);
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .tool-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.1);
            margin-bottom: 30px;
        }

        .upload-zone {
            border: 3px dashed #ff6b35;
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fff5f0;
        }

        .upload-zone:hover {
            background: #ffe8df;
            border-color: #f97316;
        }

        .upload-zone.dragging {
            background: #ffd4c4;
            border-color: #f97316;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            color: #ff6b35;
            margin-bottom: 15px;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #ff6b35 0%, #f97316 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.1);
            margin-top: 30px;
            display: none;
        }

        .result-card.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .verdict {
            text-align: center;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .verdict.clear {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
        }

        .verdict.blurry {
            background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
            color: #856404;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .detail-item {
            background: #fff5f0;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #ff6b35;
        }

        .detail-label {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .detail-value {
            color: #333;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #fff5f0;
            border-top: 4px solid #ff6b35;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .file-preview {
            margin-top: 20px;
            text-align: center;
        }

        .file-preview img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Home</a>
        
        <div class="page-header">
            <h1>🔍 Blur Detection</h1>
            <p class="subtitle">Analyze image quality and detect blur using Laplacian variance</p>
        </div>


        <div class="tool-card">
            <div class="upload-zone" id="dropZone">
                <div class="upload-icon">🖼️</div>
                <h3>Drop your image here</h3>
                <p style="color: #666; margin: 15px 0;">or</p>
                <button class="btn" onclick="document.getElementById('fileInput').click()">
                    Choose Image File
                </button>
                <p style="color: #999; margin-top: 15px; font-size: 0.9rem;">
                    Supported formats: JPG, PNG, BMP, WEBP
                </p>
            </div>
            <input type="file" id="fileInput" accept="image/*,.jpg,.jpeg,.png,.bmp,.webp">
            
            <div class="file-preview" id="filePreview"></div>
            
            <div style="text-align: center; margin-top: 30px;">
                <button class="btn" id="analyzeBtn" style="display: none;">
                    Analyze Image Quality
                </button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color: #666;">Analyzing image quality...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="result-card" id="results">
            <div class="verdict" id="verdict"></div>
            <div class="detail-grid" id="details"></div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const results = document.getElementById('results');
        const filePreview = document.getElementById('filePreview');
        
        let selectedFile = null;

        // Drag and drop handlers
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragging');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragging');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragging');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            selectedFile = file;
            
            // Show file preview
            const reader = new FileReader();
            reader.onload = (e) => {
                filePreview.innerHTML = `
                    <img src="${e.target.result}" alt="Preview">
                    <p style="margin-top: 10px; color: #666;">Selected: ${file.name}</p>
                `;
            };
            reader.readAsDataURL(file);
            
            analyzeBtn.style.display = 'inline-block';
            results.classList.remove('show');
            error.classList.remove('show');
        }

        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            loading.classList.add('show');
            error.classList.remove('show');
            results.classList.remove('show');
            analyzeBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('/predict-blur', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();
                displayResults(data);
            } catch (err) {
                error.textContent = `Error: ${err.message}`;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
                analyzeBtn.disabled = false;
            }
        });

        function displayResults(data) {
            const verdict = document.getElementById('verdict');
            const details = document.getElementById('details');

            const isClear = data.is_blurry === false;
            verdict.className = `verdict ${isClear ? 'clear' : 'blurry'}`;
            verdict.textContent = `${isClear ? '✅' : '⚠️'} ${isClear ? 'IMAGE IS CLEAR' : 'IMAGE IS BLURRY'}`;

            details.innerHTML = `
                <div class="detail-item">
                    <div class="detail-label">Blur Score</div>
                    <div class="detail-value">${data.blur_score.toFixed(2)}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Quality</div>
                    <div class="detail-value">${data.quality_assessment}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Threshold</div>
                    <div class="detail-value">${data.threshold}</div>
                </div>
            `;

            results.classList.add('show');
        }
    </script>
</body>
</html>
